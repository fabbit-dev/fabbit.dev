<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fabbit spending: where the money went</title>
  <meta name="description" content="Fabbit project expenses: date, item, amount and receipt. Raised, spent and left.">
  <link rel="canonical" href="https://fabbit.dev/en/spent/">
  <link rel="alternate" hreflang="ru" href="https://fabbit.dev/spent/">
  <link rel="alternate" hreflang="en" href="https://fabbit.dev/en/spent/">
  <link rel="alternate" hreflang="x-default" href="https://fabbit.dev/spent/">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#FFFFFF">
</head>
<body class="sub">
  <header class="subnav wrap">
    <a class="subnav__logo" href="/en/" aria-label="Fabbit, home"><img class="pixel" src="/brand/fabbit-logo-ink.svg" width="92" height="31" alt="" translate="no"></a>
    <a class="nav__lang tech" href="/spent/" hreflang="ru" lang="ru" aria-label="Русская версия" onclick="try{localStorage.setItem('fabbit-lang','ru')}catch(e){}">RU</a>
  </header>
  <main id="main" class="wrap sub__main">
    <section class="spent" id="spent" aria-labelledby="spent-title">
      <h1 class="h2" id="spent-title">Where the money went</h1>
      <dl class="spent__sums">
        <div><dt class="tech">Raised</dt><dd data-raised>—</dd></div>
        <div><dt class="tech">Spent</dt><dd data-spent>—</dd></div>
        <div><dt class="tech">Left</dt><dd data-left>—</dd></div>
      </dl>
      <div class="spent__scroll">
        <table class="spent__table">
          <thead><tr><th class="tech" scope="col">Date</th><th class="tech" scope="col">Item</th><th class="tech" scope="col">Amount</th><th class="tech" scope="col">Receipt</th></tr></thead>
          <tbody data-rows></tbody>
        </table>
      </div>
      <p class="lead" data-empty hidden>No expenses yet.</p>
      <div class="actions"><a class="btn" href="/en/">Home</a></div>
    </section>
  </main>
  <script type="module" src="/src/page.js"></script>
</body>
</html>
