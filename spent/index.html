<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Траты Fabbit: куда ушли деньги</title>
  <meta name="description" content="Расходы проекта Fabbit: дата, покупка, сумма и чек. Собрано, потрачено и остаток.">
  <link rel="canonical" href="https://fabbit.dev/spent/">
  <link rel="alternate" hreflang="ru" href="https://fabbit.dev/spent/">
  <link rel="alternate" hreflang="en" href="https://fabbit.dev/en/spent/">
  <link rel="alternate" hreflang="x-default" href="https://fabbit.dev/spent/">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#FFFFFF">
</head>
<body class="sub">
  <header class="subnav wrap">
    <a class="subnav__logo" href="/" aria-label="Fabbit, на главную"><img class="pixel" src="/brand/fabbit-logo-ink.svg" width="92" height="31" alt="" translate="no"></a>
    <a class="nav__lang tech" href="/en/spent/" hreflang="en" lang="en" aria-label="English version" onclick="try{localStorage.setItem('fabbit-lang','en')}catch(e){}">EN</a>
  </header>
  <main id="main" class="wrap sub__main">
    <section class="spent" id="spent" aria-labelledby="spent-title">
      <h1 class="h2" id="spent-title">Куда ушли деньги</h1>
      <dl class="spent__sums">
        <div><dt class="tech">Собрано</dt><dd data-raised>—</dd></div>
        <div><dt class="tech">Потрачено</dt><dd data-spent>—</dd></div>
        <div><dt class="tech">Остаток</dt><dd data-left>—</dd></div>
      </dl>
      <div class="spent__scroll">
        <table class="spent__table">
          <thead><tr><th class="tech" scope="col">Дата</th><th class="tech" scope="col">Что купили</th><th class="tech" scope="col">Сумма</th><th class="tech" scope="col">Чек</th></tr></thead>
          <tbody data-rows></tbody>
        </table>
      </div>
      <p class="lead" data-empty hidden>Трат пока нет.</p>
      <div class="actions"><a class="btn" href="/">На главную</a></div>
    </section>
  </main>
  <script type="module" src="/src/page.js"></script>
</body>
</html>
